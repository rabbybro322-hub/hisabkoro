const V=[['dash','ড্যাশবোর্ড','home'],['sale','বিক্রি (POS)','cart'],['prod','পণ্য','box'],['cust','কাস্টমার','users'],['due','বাকি খাতা','file'],['exp','খরচ','wallet'],['rep','রিপোর্ট','rep'],['set','সেটিংস','set']];
const PL={today:'আজ',yest:'গতকাল','7':'শেষ ৭ দিন','30':'শেষ ৩০ দিন',month:'এই মাস',last:'গত মাস',custom:'কাস্টম তারিখ'};
let DB={p:[],c:[],s:[],pay:[],e:[]},shop=null,cart=[],view='dash',chart=null,busy=false,rng=7,period='today',pf='',pfLow=false,cf='',rpt={k:'30',f:'',t:''},saleKey=crypto.randomUUID();
const $=s=>document.querySelector(s),val=id=>$('#'+id).value.trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n<0?'-':'')+'৳'+(Math.abs(n)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const paisa=v=>{const n=Math.round(parseFloat(v)*100);return isNaN(n)?0:n};
const day=(d=new Date())=>d.toLocaleDateString('en-CA',{timeZone:'Asia/Dhaka'});
const dstr=o=>{const d=new Date();d.setDate(d.getDate()+o);return day(d)};
const shiftD=(s,n)=>new Date(Date.parse(s+'T00:00:00Z')+n*864e5).toISOString().slice(0,10);
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0),empty=t=>`<div class="empty">${t}</div>`;
const paidOf=s=>sum(DB.pay.filter(p=>p.sid===s.id),p=>p.amt),dueOf=s=>s.total-paidOf(s),custDue=id=>sum(DB.s.filter(s=>s.cid===id),dueOf);
const cname=id=>(DB.c.find(c=>c.id===id)||{}).name||'';
function rel(t){const m=Math.floor((Date.now()-t)/6e4);if(m<1)return'এইমাত্র';if(m<60)return m+' মিনিট আগে';const h=Math.floor(m/60);return h<24?h+' ঘণ্টা আগে':Math.floor(h/24)+' দিন আগে'}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',3200)}
const ok=r=>{if(r.error)throw r.error;return r.data};
const act=async f=>{try{await f()}catch(e){toast(e.message||'সমস্যা হয়েছে, আবার চেষ্টা করুন')}};

/* ---------- period & metrics ---------- */
function range(k,f,t){const td=dstr(0);if(k==='today')return[td,td];if(k==='yest'){const y=dstr(-1);return[y,y]}
 if(k==='7')return[dstr(-6),td];if(k==='30')return[dstr(-29),td];if(k==='month')return[td.slice(0,8)+'01',td];
 if(k==='last'){const[y,m]=td.split('-').map(Number);return[new Date(Date.UTC(y,m-2,1)).toISOString().slice(0,10),new Date(Date.UTC(y,m-1,0)).toISOString().slice(0,10)]}
 return[f||td,t||f||td]}
function metrics(a,b){const ss=DB.s.filter(s=>s.date>=a&&s.date<=b),ee=DB.e.filter(e=>e.date>=a&&e.date<=b),pp=DB.pay.filter(p=>p.date>=a&&p.date<=b);
 const sales=sum(ss,s=>s.total),cogs=sum(ss,s=>s.cogs),exp=sum(ee,e=>e.amt);
 return{ss,ee,sales,cogs,gross:sales-cogs,exp,net:sales-cogs-exp,cash:sum(pp,p=>p.amt),credit:sum(ss,s=>s.total-sum(DB.pay.filter(p=>p.sid===s.id&&p.kind==='sale'),p=>p.amt))}}
function series(a,b,f){let d=[];for(let x=a;x<=b&&d.length<62;x=shiftD(x,1))d.push(x);if(d.length<7)d=[...Array(7)].map((_,i)=>shiftD(b,i-6));return d.map(x=>f(metrics(x,x)))}
function spark(v,c){const mx=Math.max(...v,1),mn=Math.min(...v,0),w=90,h=34,r=mx-mn||1;return `<svg viewBox="0 0 ${w} ${h}" width="90" height="34"><polyline points="${v.map((x,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-3-(x-mn)/r*(h-6)).toFixed(1)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/></svg>`}
const tr=(c,p,inv)=>p>0?`<b class="${(inv?c<=p:c>=p)?'ok':'bad'}" style="font-weight:600">${c>=p?'↑':'↓'} ${Math.abs(Math.round((c-p)/p*100))}%</b>`:'<span class="mut">—</span>';

/* ---------- Auth (phone + password; phone becomes a hidden login id) ---------- */
const normPhone=v=>{const m=v.replace(/\D/g,'').replace(/^880/,'0');return /^01[3-9]\d{8}$/.test(m)?m:null};
const emailOf=p=>`hk.88${p}@gmail.com`; // hidden login id only; no email is ever sent (Confirm email must stay OFF)
function authView(mode){$('#root').innerHTML=`<div class="auth"><div class="card ac"><div class="logo" style="padding-bottom:2px">হিসাব করো</div><p class="sub" style="margin-bottom:16px">আপনার ব্যবসার হিসাব, এখন আরও সহজ।</p>
${cfgOk?'':'<p class="bad" style="margin-bottom:12px">Supabase সেটআপ বাকি। ফাইলের উপরে URL ও anon key বসান।</p>'}
<div class="row" style="margin-bottom:12px"><button class="b ${mode==='in'?'':'o'}" onclick="authView('in')">লগইন</button><button class="b ${mode==='up'?'':'o'}" onclick="authView('up')">নতুন অ্যাকাউন্ট</button></div>
${mode==='up'?'<input id="an" placeholder="দোকানের নাম"><input id="ao" placeholder="আপনার নাম">':''}
<input id="ap" placeholder="মোবাইল নম্বর (01XXXXXXXXX)" inputmode="tel"><input id="aw" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)">
<button class="b" style="width:100%" id="ab" onclick="submitAuth('${mode}')">${mode==='up'?'অ্যাকাউন্ট খুলুন':'লগইন করুন'}</button>
<p class="sub" style="margin:12px 0 0;font-size:13px">পাসওয়ার্ড ভুলে গেলে রিসেট করার জন্য SMS কোড পরে যোগ হবে। তাই পাসওয়ার্ড মনে রাখুন।</p></div></div>`}
function submitAuth(mode){act(async()=>{if(!cfgOk)throw{message:'আগে Supabase সেটআপ করুন'};
 const ph=normPhone($('#ap').value),pw=$('#aw').value;if(!ph)throw{message:'সঠিক মোবাইল নম্বর দিন'};if(pw.length<6)throw{message:'পাসওয়ার্ড কমপক্ষে ৬ অক্ষর হতে হবে'};
 $('#ab').disabled=true;
 try{if(mode==='up'){const sn=val('an'),on=val('ao');if(!sn||!on)throw{message:'দোকানের নাম ও আপনার নাম দিন'};
  const {data,error}=await sb.auth.signUp({email:emailOf(ph),password:pw,options:{data:{shop_name:sn,owner_name:on,phone:ph}}});
  if(error)throw{message:/registered/i.test(error.message)?'এই নম্বরে আগেই অ্যাকাউন্ট আছে':error.message};
  if(!data.session)throw{message:'Supabase-এ Authentication > Providers > Email থেকে "Confirm email" বন্ধ করুন'};
  await enter(data.user)}
 else{const {data,error}=await sb.auth.signInWithPassword({email:emailOf(ph),password:pw});if(error)throw{message:'নম্বর বা পাসওয়ার্ড ভুল'};await enter(data.user)}}
 finally{const b=$('#ab');if(b)b.disabled=false}})}
async function enter(user){let sh=ok(await sb.from('shops').select('*').limit(1));
 if(!sh.length){const m=user.user_metadata||{};sh=[ok(await sb.from('shops').insert({name:m.shop_name||'আমার দোকান',owner_name:m.owner_name||'মালিক',phone:m.phone||''}).select().single())]}

function shell(){$('#root').innerHTML=`<div id="shell"><aside><div class="logo">হিসাব করো<small>HisabKoro</small></div><nav id="nav"></nav>
 <div class="me"><div class="av">${esc(shop.owner_name.slice(0,1))}</div><div><b>${esc(shop.owner_name)}</b><small>মালিক</small></div><button title="লগআউট" onclick="logout()">${ic('out')}</button></div></aside>

 const [p,c,s,pay,e]=(await Promise.all(['products','customers','sales','payments','expenses'].map(q))).map(ok);const ts=r=>+new Date(r.created_at),dt=r=>day(new Date(r.created_at));
 DB={p,c,s:s.map(r=>({...r,date:r.day,ts:ts(r)})),pay:pay.map(r=>({...r,ts:ts(r),date:dt(r)})),e:e.map(r=>({...r,date:r.day,ts:ts(r)}))}}

/* ---------- search & notifications ---------- */
function gsearch(){const q=val('gs').toLowerCase(),r=$('#gr');if(!q){r.style.display='none';return}

function jump(t,id){$('#gr').style.display='none';$('#gs').value='';if(t==='p'){pf=DB.p.find(p=>p.id===id).name;pfLow=false;go('prod')}else{cf=cname(id);go('cust')}}

function updBell(){const n=notes().length,b=$('#bc');if(b){b.textContent=n>99?'99+':n;b.style.display=n?'grid':'none'}}
function toggleNt(){const d=$('#nt'),n=notes();if(d.style.display==='block'){d.style.display='none';return}
 d.innerHTML=n.length?n.slice(0,12).map(x=>`<button onclick="$('#nt').style.display='none';go('${x.v}')">${x.t}</button>`).join(''):'<p>কোনো নোটিফিকেশন নেই</p>';d.style.display='block'}
document.addEventListener('click',e=>{if(!e.target.closest('.sw'))$('#gr')&&($('#gr').style.display='none');if(!e.target.closest('.nw'))$('#nt')&&($('#nt').style.display='none')});

 const td=dstr(0),mm=metrics(td.slice(0,8)+'01',td),l7=series(dstr(-6),td,x=>x.sales),mx=Math.max(...l7,1);

 return `<div class="hd"><div><h1>স্বাগতম, ${esc(shop.owner_name)}! 👋</h1><p class="sub">আপনার ব্যবসায় ${PL[period]==='আজ'?'আজ':PL[period]} কী হচ্ছে</p></div><select onchange="period=this.value;go('dash')">${['today','yest','7','30','month','last'].map(k=>`<option value="${k}" ${k===period?'selected':''}>${PL[k]}</option>`).join('')}</select></div>
 <div class="grid g4" style="margin-bottom:16px">
 ${stat('t-b','c-b','cart','বিক্রি',fmt(m.sales),`${tr(m.sales,pm.sales)}${spark(series(a,b,x=>x.sales),'#1677F5')}`)}
 ${stat('t-g','c-g','coin','নিট লাভ',`<span class="${m.net<0?'bad':''}">${fmt(m.net)}</span>`,`${tr(m.net,pm.net)}${spark(series(a,b,x=>x.net),'#16A36A')}`)}
 ${stat('t-r','c-r','file','মোট বাকি',fmt(due),`<span class="mut">${dueC} জন কাস্টমারের কাছে</span>`)}
 ${stat('t-v','c-v','wallet','খরচ',fmt(m.exp),`${tr(m.exp,pm.exp,1)}${spark(series(a,b,x=>x.exp),'#7C4DDB')}`)}</div>
 <div class="grid g2" style="margin-bottom:16px"><div class="card"><h3>বিক্রির চিত্র<span class="seg">${[[7,'7D'],[30,'30D'],[90,'3M'],[365,'1Y']].map(([n,l])=>`<button class="b ${rng===n?'on':''}" onclick="rng=${n};go('dash')">${l}</button>`).join('')}</span></h3><canvas id="ch" height="130"></canvas></div>
 <div class="card"><h3>স্টক কম (${low.length})<a onclick="pfLow=true;pf='';go('prod')">সব দেখুন →</a></h3>${low.length?low.slice(0,5).map(p=>`<div class="tx"><div class="ini">${esc(p.name.slice(0,1))}</div><div class="m"><b>${esc(p.name)}</b><br><b class="${p.stock<=0?'bad':'warn'}" style="font-weight:500">${p.stock<=0?'স্টক শেষ':'মাত্র '+p.stock+' '+esc(p.unit)+' আছে'}</b></div></div>`).join(''):empty('কোনো পণ্যের স্টক কম নেই')}</div></div>
 <div class="grid g2"><div class="card"><h3>সাম্প্রতিক লেনদেন</h3>${rec.length?rec.map(r=>`<div class="tx"><div class="chip ${r.ch}">${ic(r.i)}</div><div class="m"><b>${r.t}</b><br><small>${r.s}</small></div><small>${rel(r.d)}</small><span class="tag ${r.c}">${r.k}</span></div>`).join(''):empty('এখনো কোনো লেনদেন নেই। “বিক্রি (POS)” থেকে প্রথম বিক্রি করুন।')}</div>

 <div class="card"><input id="q" placeholder="পণ্য খুঁজুন" oninput="posList()" style="width:100%;margin-bottom:12px"><div class="pg" id="pl"></div></div>

 <div class="row" style="margin-top:12px"><input id="sd" type="number" min="0" step="0.01" placeholder="ছাড় ৳" oninput="upd()"><input id="sp" type="number" min="0" step="0.01" placeholder="পরিশোধ ৳" oninput="upd()"></div>
 <div class="row"><select id="sc"><option value="">কাস্টমার (বাকির জন্য আবশ্যক)</option>${DB.c.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><select id="sm"><option>নগদ</option><option>বিকাশ</option><option>নগদ (Nagad)</option><option>ব্যাংক</option><option>অন্যান্য</option></select></div>
 <p>সাবটোটাল: <b>${fmt(t.sub)}</b></p><p>মোট: <b id="t2">${fmt(t.sub)}</b></p><p>বাকি: <b id="t3" class="bad">${fmt(t.sub)}</b></p>

cust(){return `<h1>কাস্টমার</h1><p class="sub">কাস্টমারের প্রোফাইল, কেনাকাটা ও বাকির হিসাব</p><div class="card" style="margin-bottom:16px"><div class="row"><input id="cn" placeholder="কাস্টমারের নাম"><input id="cp" placeholder="ফোন নম্বর" inputmode="tel"><button class="b" style="flex:0 0 auto" onclick="addCust()">যোগ করুন</button></div></div>

 <div class="card sc">${L.length?`<table><tr><th>কাস্টমার</th><th>ফোন</th><th>মোট কেনা</th><th>বাকি</th><th>শেষ কেনা</th><th></th></tr>${L.map(({c,d})=>{const ss=DB.s.filter(s=>s.cid===c.id);return `<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${fmt(sum(ss,s=>s.total))}</td><td class="bad"><b>${fmt(d)}</b></td><td>${ss.length?ss[ss.length-1].date:'—'}</td><td class="r"><button class="b" onclick="collect('${c.id}')">টাকা আদায়</button> <button class="b o" onclick="statement('${c.id}')">স্টেটমেন্ট</button></td></tr>`}).join('')}</table>`:empty('কোনো বাকি নেই। 🎉')}</div>`},

rep(){const[a,b]=range(rpt.k,rpt.f,rpt.t),m=metrics(a,b),rcv=sum(DB.s,dueOf),cat={},top={};

 return `<div class="hd"><div><h1>রিপোর্ট</h1><p class="sub">${a} থেকে ${b}</p></div><div class="row" style="margin:0"><select onchange="rpt.k=this.value;go('rep')">${Object.keys(PL).map(k=>`<option value="${k}" ${k===rpt.k?'selected':''}>${PL[k]}</option>`).join('')}</select>${rpt.k==='custom'?`<input type="date" value="${rpt.f}" onchange="rpt.f=this.value;go('rep')"><input type="date" value="${rpt.t}" onchange="rpt.t=this.value;go('rep')">`:''}<button class="b o" onclick="exportCsv()">CSV ডাউনলোড</button><button class="b o" onclick="window.print()">প্রিন্ট</button></div></div>

 ${stat('t-b','c-b','wallet','নগদ প্রাপ্ত (এই সময়ে)',fmt(m.cash),'<span class="mut">বাকি আদায় সহ</span>')}${stat('t-r','c-r','file','নতুন বাকি বিক্রি',fmt(m.credit),`<span class="mut">মোট পাওনা এখন ${fmt(rcv)}</span>`)}</div>

 $('#pt').innerHTML=L.length?`<table><tr><th>নাম</th><th>ক্রয়</th><th>বিক্রয়</th><th>স্টক</th><th></th></tr>${L.map(p=>`<tr><td>${esc(p.name)}</td><td>${fmt(p.buy)}</td><td>${fmt(p.sell)}</td><td class="${p.stock<=p.min?'bad':''}">${p.stock} ${esc(p.unit)}</td><td class="r"><button class="b o" onclick="adjStock('${p.id}')">স্টক যোগ</button> <button class="b d" onclick="delProd('${p.id}')">মুছুন</button></td></tr>`).join('')}</table>`:empty(DB.p.length?'কিছু পাওয়া যায়নি':'কোনো পণ্য নেই। উপরের ফর্ম থেকে প্রথম পণ্য যোগ করুন।')}
function custTable(){const q=cf.toLowerCase(),L=DB.c.filter(c=>(c.name+c.phone).toLowerCase().includes(q));
 $('#ct').innerHTML=L.length?`<table><tr><th>নাম</th><th>ফোন</th><th>মোট কেনা</th><th>বাকি</th><th></th></tr>${L.map(c=>{const d=custDue(c.id);return `<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${fmt(sum(DB.s.filter(s=>s.cid===c.id),s=>s.total))}</td><td class="${d?'bad':''}">${fmt(d)}</td><td class="r">${d>0?`<button class="b" onclick="collect('${c.id}')">টাকা আদায়</button> `:''}<button class="b o" onclick="statement('${c.id}')">প্রোফাইল</button></td></tr>`}).join('')}</table>`:empty(DB.c.length?'কিছু পাওয়া যায়নি':'কোনো কাস্টমার নেই। প্রথম কাস্টমার যোগ করুন।')}
const _go=go;go=function(v){_go(v);if(v==='prod')prodTable();if(v==='cust')custTable()};
function drawChart(){const td=dstr(0);let bk=[];
 if(rng===365){const[y,m]=td.split('-').map(Number);for(let i=11;i>=0;i--){const k=new Date(Date.UTC(y,m-1-i,1)).toISOString().slice(0,7);bk.push({l:k,a:k+'-01',b:k+'-31'})}}
 else if(rng===90){for(let i=12;i>=0;i--){const b=shiftD(td,-i*7);bk.push({l:b.slice(5),a:shiftD(b,-6),b})}}
 else for(let i=rng-1;i>=0;i--){const d=shiftD(td,-i);bk.push({l:d.slice(5),a:d,b:d})}
 chart=new Chart($('#ch'),{type:'line',data:{labels:bk.map(x=>x.l),datasets:[{data:bk.map(x=>sum(DB.s.filter(s=>s.date>=x.a&&s.date<=x.b),s=>s.total)/100),borderColor:'#1677F5',backgroundColor:'rgba(22,119,245,.08)',fill:true,tension:.3,pointRadius:rng>30?3:2}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}})}
function statement(cid){const c=DB.c.find(x=>x.id===cid),ss=DB.s.filter(s=>s.cid===cid).sort((a,b)=>a.ts-b.ts),pp=DB.pay.filter(p=>p.cid===cid).sort((a,b)=>a.ts-b.ts),m=document.createElement('div');m.id='modal';
 m.innerHTML=`<div class="mb"><div class="noprint" style="text-align:right"><button class="b o" onclick="window.print()">প্রিন্ট</button> <button class="b" onclick="$('#modal').remove()">বন্ধ করুন</button></div>
 <h2 style="font-family:'Hind Siliguri'">${esc(shop.name)}</h2><p>কাস্টমার স্টেটমেন্ট: <b>${esc(c.name)}</b> ${esc(c.phone)} · ${day()}</p>
 <h3>বিক্রি</h3>${ss.length?`<table><tr><th>তারিখ</th><th>বিল</th><th class="r">মোট</th><th class="r">পরিশোধ</th><th class="r">বাকি</th></tr>${ss.map(s=>`<tr><td>${s.date}</td><td>#${s.no}</td><td class="r">${fmt(s.total)}</td><td class="r">${fmt(paidOf(s))}</td><td class="r">${fmt(dueOf(s))}</td></tr>`).join('')}</table>`:'<p class="mut">কোনো বিক্রি নেই</p>'}
 <h3>পেমেন্ট</h3>${pp.length?`<table><tr><th>তারিখ</th><th>ধরন</th><th>মাধ্যম</th><th class="r">পরিমাণ</th></tr>${pp.map(p=>`<tr><td>${p.date}</td><td>${p.kind==='collect'?'বাকি আদায়':'বিক্রির সময়'}</td><td>${esc(p.method)}</td><td class="r">${fmt(p.amt)}</td></tr>`).join('')}</table>`:'<p class="mut">কোনো পেমেন্ট নেই</p>'}
 <p style="margin-top:14px">মোট কেনা ${fmt(sum(ss,s=>s.total))} · মোট পরিশোধ ${fmt(sum(pp,p=>p.amt))} · <b>বাকি ${fmt(custDue(cid))}</b></p></div>`;document.body.appendChild(m)}
function exportCsv(){const[a,b]=range(rpt.k,rpt.f,rpt.t),q=x=>`"${String(x).replace(/"/g,'""')}"`,rows=[['বিল','তারিখ','কাস্টমার','মোট','ছাড়','পরিশোধ','বাকি'],...DB.s.filter(s=>s.date>=a&&s.date<=b).map(s=>[s.no,s.date,cname(s.cid),s.total/100,s.disc/100,paidOf(s)/100,dueOf(s)/100])];
 const u=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'})),l=document.createElement('a');l.href=u;l.download=`hisabkoro-sales-${a}_${b}.csv`;l.click();URL.revokeObjectURL(u)}

/* ---------- Actions (all writes go to Supabase; sales and due collection use server-side functions) ---------- */
const addProd=()=>act(async()=>{const name=val('pn'),buy=paisa(val('pb')),sell=paisa(val('ps')),stock=parseFloat(val('pq'))||0,min=parseFloat(val('pm'))||0;
 if(!name)throw{message:'পণ্যের নাম লিখুন'};if(sell<=0)throw{message:'বিক্রয়মূল্য ০-এর বেশি হতে হবে'};if(stock<0||min<0)throw{message:'স্টক ঋণাত্মক হতে পারে না'};
 ok(await sb.from('products').insert({shop_id:shop.id,name,unit:$('#pu').value,buy,sell,stock,min}));toast('পণ্য যোগ হয়েছে');pf='';pfLow=false;await refresh('prod')});
const delProd=id=>confirm('এই পণ্য মুছবেন? পুরোনো বিক্রির হিসাব অপরিবর্তিত থাকবে।')&&act(async()=>{ok(await sb.from('products').delete().eq('id',id));await refresh('prod')});
const adjStock=id=>act(async()=>{const p=DB.p.find(x=>x.id===id),n=parseFloat(prompt(`${p.name}: কত ${p.unit} যোগ করবেন?`));if(!(n>0))return;ok(await sb.from('products').update({stock:p.stock+n}).eq('id',id));await refresh('prod')});
const addCust=()=>act(async()=>{const name=val('cn');if(!name)throw{message:'নাম লিখুন'};ok(await sb.from('customers').insert({shop_id:shop.id,name,phone:val('cp')}));cf='';await refresh('cust')});
const addExp=()=>act(async()=>{const amt=paisa(val('ea'));if(amt<=0)throw{message:'সঠিক পরিমাণ লিখুন'};if(!val('ed'))throw{message:'তারিখ দিন'};
 ok(await sb.from('expenses').insert({shop_id:shop.id,cat:$('#ec').value,amt,day:val('ed'),note:val('en')}));toast('খরচ যোগ হয়েছে');await refresh('exp')});
const delExp=id=>confirm('এই খরচ মুছবেন?')&&act(async()=>{ok(await sb.from('expenses').delete().eq('id',id));await refresh('exp')});
const saveShop=()=>act(async()=>{const name=val('sn'),owner_name=val('so');if(!name||!owner_name)throw{message:'নাম খালি রাখা যাবে না'};
 ok(await sb.from('shops').update({name,owner_name}).eq('id',shop.id));shop={...shop,name,owner_name};shell();go('set');toast('সংরক্ষণ হয়েছে')});
const savePw=()=>act(async()=>{const p=$('#np').value;if(p.length<6)throw{message:'পাসওয়ার্ড কমপক্ষে ৬ অক্ষর হতে হবে'};const r=await sb.auth.updateUser({password:p});if(r.error)throw r.error;$('#np').value='';toast('পাসওয়ার্ড বদলানো হয়েছে')});
function posList(){const el=$('#pl');if(!el)return;const q=(($('#q')||{}).value||'').toLowerCase();el.innerHTML=DB.p.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<button onclick="addCart('${p.id}')"><b>${esc(p.name)}</b><span>${fmt(p.sell)} · স্টক ${p.stock}</span></button>`).join('')||empty(DB.p.length?'কিছু পাওয়া যায়নি':'আগে “পণ্য” পাতা থেকে পণ্য যোগ করুন')}
function addCart(id){const p=DB.p.find(x=>x.id===id),c=cart.find(x=>x.id===id);if(c)c.qty++;else cart.push({id,name:p.name,price:p.sell,qty:1});go('sale')}
function setQty(i,v){const n=parseFloat(v);if(n>0)cart[i].qty=n;go('sale')}
const cartTotals=()=>({sub:Math.round(sum(cart,c=>c.price*c.qty))});
function upd(){const s=cartTotals().sub,d=paisa(val('sd')),p=paisa(val('sp'));$('#t2').textContent=fmt(s-d);$('#t3').textContent=fmt(s-d-p)}
const doSale=()=>{if(busy)return;act(async()=>{if(!cart.length)throw{message:'কার্ট খালি'};busy=true;$('#sb').disabled=true;
 try{ok(await sb.rpc('create_sale',{p_shop:shop.id,p_cid:$('#sc').value||null,p_items:cart.map(c=>({id:c.id,qty:c.qty})),p_disc:paisa(val('sd')),p_paid:paisa(val('sp')),p_method:$('#sm').value,p_key:saleKey}));
  cart=[];saleKey=crypto.randomUUID();toast('বিক্রি সম্পন্ন হয়েছে');await refresh('sale')}
 finally{busy=false;const b=$('#sb');if(b)b.disabled=false}})};
const collect=cid=>act(async()=>{const due=custDue(cid),n=paisa(prompt(`কত টাকা আদায় হলো? (বাকি ${fmt(due)})`));if(n<=0)return;if(n>due)throw{message:'আদায় বাকির চেয়ে বেশি হতে পারে না'};
 ok(await sb.rpc('collect_due',{p_shop:shop.id,p_cid:cid,p_amt:n}));toast('টাকা আদায় রেকর্ড হয়েছে');await refresh(view)});

/* ---------- Boot ---------- */
act(async()=>{if(!cfgOk)return authView('in');const {data}=await sb.auth.getSession();data.session?await enter(data.session.user):authView('in')});
</script>
